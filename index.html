<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#BC002D" />
  <title>Japon · novembre 2026</title>
  <style>
    :root {
      --bg: #FFF6F4;
      --ink: #1C1214;
      --muted: #7A5A5C;
      --card: #FFFFFF;
      --line: #F0D4D6;
      --accent: #BC002D;
      --accent-soft: #F8D5DA;
      --vol: #BC002D;
      --vol-soft: #F8D5DA;
      --danger: #9B2C2C;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; color-scheme: only light; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.4;
      padding: 0 16px 48px;
      padding-bottom: max(48px, env(safe-area-inset-bottom));
    }
    body::before {
      content: "";
      position: fixed;
      top: -90px;
      right: -70px;
      width: 240px;
      height: 240px;
      background: #BC002D;
      border-radius: 50%;
      opacity: 0.1;
      pointer-events: none;
      z-index: 0;
    }

    .wrap { max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }

    header {
      padding: 28px 0 8px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 2;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .flag {
      width: 42px;
      height: 28px;
      background: #fff;
      border: 1px solid #E8C9CC;
      border-radius: 3px;
      box-shadow: 0 1px 0 rgba(188, 0, 45, 0.08);
      position: relative;
      flex-shrink: 0;
    }
    .flag::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      background: #BC002D;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    header h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.75rem;
      font-weight: 500;
      margin: 0;
      letter-spacing: 0.02em;
    }
    header p { margin: 0; color: var(--muted); font-size: 0.92rem; }
    #sync {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    #sync.err { color: var(--danger); }

    h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      font-weight: 500;
      margin: 28px 0 12px;
    }

    .day {
      background-color: #F8DDE0;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px 10px;
      margin-bottom: 10px;
    }
    .day-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .day-head strong { font-size: 0.95rem; }
    .badge {
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--vol-soft);
      color: var(--vol);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .slot {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px;
      padding: 7px 0;
      border-top: 1px solid var(--line);
    }
    .slot:first-of-type { border-top: 0; }
    .slot-label {
      font-size: 0.78rem;
      color: var(--muted);
      padding-top: 5px;
    }
    .chips { display: flex; flex-direction: column; gap: 6px; min-height: 28px; }
    .chip {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin: 0;
      padding: 7px 10px;
      border: 2px solid #BC002D;
      border-radius: 9px;
      background: #ffffff;
      color: #BC002D;
      font: inherit;
      font-size: 0.88rem;
      text-align: left;
      cursor: pointer;
    }
    .chip:active { transform: scale(0.99); }
    .empty {
      color: var(--muted);
      font-size: 0.82rem;
      padding: 6px 2px;
      font-style: italic;
    }

    .act-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .act-head h2 { margin: 28px 0 12px; }
    #add-btn {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .act-list { display: flex; flex-direction: column; gap: 8px; }
    .act {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      font: inherit;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .act:active { background: #FFF0F1; }
    .act-note {
      display: block;
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 400;
    }
    .jst {
      font-size: 0.82rem;
      color: var(--accent);
      margin: -6px 0 14px;
    }
    .cat-block { margin-bottom: 18px; }
    .cat-block h3 {
      font-size: 0.88rem;
      font-weight: 650;
      margin: 0 0 8px;
      color: var(--ink);
    }
    .cat-block h3 span {
      display: block;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--muted);
      margin-top: 2px;
    }
    .cat-pick {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #fff;
      font-size: 0.9rem;
    }
    .cat-pick:has(:checked) {
      border-color: var(--accent);
      background: #FFF5F6;
    }
    .cat-pick input { accent-color: var(--accent); margin-top: 3px; }

    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26, 23, 20, 0.35);
      z-index: 10;
    }
    .backdrop.on { display: block; }

    .drawer {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 11;
      background: var(--card);
      border-radius: 18px 18px 0 0;
      padding: 12px 16px calc(20px + env(safe-area-inset-bottom));
      max-height: 86vh;
      overflow: auto;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.12);
    }
    .drawer.on { display: block; }
    .handle {
      width: 40px;
      height: 4px;
      background: var(--line);
      border-radius: 999px;
      margin: 4px auto 14px;
    }
    .drawer h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      margin: 0 0 12px;
      font-size: 1.15rem;
    }
    .drawer p.hint { color: var(--muted); font-size: 0.88rem; margin: 0 0 12px; }

    input[type="text"] {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      margin-bottom: 12px;
    }

    .btn {
      appearance: none;
      border: 0;
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      font: inherit;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.ghost { background: transparent; color: var(--muted); }
    .btn.danger { background: #F4D6D6; color: var(--danger); margin-top: 8px; }

    .pick-day { margin-bottom: 10px; }
    .pick-day .name { font-size: 0.85rem; margin-bottom: 6px; color: var(--muted); }
    .pick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pick {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 10px 8px;
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .pick:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .pick b { display: block; font-size: 0.88rem; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <span class="flag" role="img" aria-label="Drapeau du Japon"></span>
        <h1>Japon</h1>
      </div>
      <p>7 – 22 novembre 2026 · Paris ⇄ Japon</p>
      <span id="sync">Chargement…</span>
    </header>

    <h2>Planning jour par jour</h2>
    <div id="planning"></div>

    <div class="act-head">
      <h2>Activités</h2>
      <button type="button" id="add-btn" aria-label="Ajouter une activité">+</button>
    </div>
    <p class="jst">Les sites de résa sont à l’heure japonaise (JST).</p>
    <div id="activities" class="act-list"></div>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true"></div>

  <script>
    const API = "https://n8n-hosted-u54587.vm.elestio.app/webhook/voyage-tokyo-26-k7m2";
    const CACHE_KEY = "voyage-tokyo-2026";
    const MAX = 2;

    const DAYS = [];
    for (let d = 7; d <= 22; d++) DAYS.push(`2026-11-${String(d).padStart(2, "0")}`);

    const TRAVEL = new Set(["2026-11-07", "2026-11-08", "2026-11-22"]);

    const CATEGORIES = [
      { id: "urgence", emoji: "🚨", label: "Urgence maximale", hint: "À booker le jour J" },
      { id: "resa", emoji: "📅", label: "1 à 3 mois avant", hint: "À réserver assez tôt" },
      { id: "gastro", emoji: "🍜", label: "Gastronomie & culture", hint: "Sur le long terme" },
      { id: "events", emoji: "✨", label: "Événements de novembre", hint: "" },
      { id: "gratuit", emoji: "🏃", label: "Spots gratuits", hint: "Lever aux aurores" },
    ];

    const dayFmt = new Intl.DateTimeFormat("fr-FR", {
      weekday: "short",
      day: "numeric",
      month: "short",
    });

    let activities = [];
    let rev = 0;
    let chain = Promise.resolve();

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function enqueue(fn) {
      const run = chain.then(fn, fn);
      chain = run.catch(() => {});
      return run;
    }

    async function fetchJson(opts, tries) {
      let last;
      for (let i = 0; i < (tries || 3); i++) {
        try {
          const res = await fetch(API, opts);
          if (!res.ok) throw new Error("HTTP " + res.status);
          return await res.json();
        } catch (err) {
          last = err;
          await new Promise((r) => setTimeout(r, 350 * (i + 1)));
        }
      }
      throw last;
    }

    function inSlot(date, part) {
      const slot = `${date}-${part}`;
      return activities.filter((a) => a.slot === slot);
    }

    function setSync(text, err) {
      const el = document.getElementById("sync");
      el.textContent = text;
      el.classList.toggle("err", !!err);
    }

    function persistLocal() {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ activities }));
    }

    async function loadRemote() {
      const started = rev;
      const data = await fetchJson();
      if (!Array.isArray(data.activities)) throw new Error("Réponse invalide");
      if (started !== rev) return;
      activities = data.activities;
      persistLocal();
    }

    function touch() {
      rev += 1;
      persistLocal();
      render();
      saveRemote();
    }

    function saveRemote() {
      const started = rev;
      setSync("Enregistrement…");
      return enqueue(async () => {
        if (started !== rev) return;
        const snapshot = activities;
        try {
          const data = await fetchJson({
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ activities: snapshot }),
          });
          if (started !== rev) return;
          if (Array.isArray(data.activities)) {
            activities = data.activities;
            persistLocal();
          }
          setSync("Enregistré · visible par tout le monde");
        } catch (_e) {
          setSync("Pas de réseau — nouvel essai au prochain geste", true);
        }
      });
    }

    function render() {
      const planning = document.getElementById("planning");
      planning.innerHTML = DAYS.map((date) => {
        const label = dayFmt.format(new Date(date + "T12:00:00"));
        const badge = TRAVEL.has(date) ? '<span class="badge">Vol</span>' : "";
        return `
          <article class="day">
            <div class="day-head">
              <strong>${label}</strong>
              ${badge}
            </div>
            ${renderSlot(date, "am", "Matin")}
            ${renderSlot(date, "pm", "Après-midi")}
          </article>`;
      }).join("");

      const list = activities.filter((a) => !a.slot);
      const box = document.getElementById("activities");
      if (!list.length) {
        box.innerHTML = '<p class="empty">Aucune proposition. Appuie sur + pour en ajouter une.</p>';
        return;
      }
      box.innerHTML = CATEGORIES.map((cat) => {
        const items = list.filter((a) => a.category === cat.id);
        if (!items.length) return "";
        const hint = cat.hint ? `<span>${escapeHtml(cat.hint)}</span>` : "";
        const cards = items.map((a) => {
          const note = a.note ? `<span class="act-note">${escapeHtml(a.note)}</span>` : "";
          return `<button type="button" class="act" data-assign="${a.id}"><strong>${escapeHtml(a.title)}</strong>${note}</button>`;
        }).join("");
        return `<section class="cat-block"><h3>${cat.emoji} ${escapeHtml(cat.label)}${hint}</h3>${cards}</section>`;
      }).join("");
    }

    function renderSlot(date, part, label) {
      const items = inSlot(date, part);
      let inner;
      if (!items.length) {
        inner = '<div class="empty">Libre</div>';
      } else {
        inner = items.map((a) =>
          `<span class="chip" role="button" tabindex="0" data-open="${a.id}">${escapeHtml(a.title)}</span>`
        ).join("");
      }
      return `
        <div class="slot">
          <div class="slot-label">${label}${items.length ? ` · ${items.length}/${MAX}` : ""}</div>
          <div class="chips">${inner}</div>
        </div>`;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function openDrawer(html) {
      const drawer = document.getElementById("drawer");
      drawer.innerHTML = '<div class="handle"></div>' + html;
      drawer.classList.add("on");
      document.getElementById("backdrop").classList.add("on");
    }

    function closeDrawer() {
      document.getElementById("drawer").classList.remove("on");
      document.getElementById("backdrop").classList.remove("on");
    }

    function openAdd() {
      const cats = CATEGORIES.map((c, i) => `
        <label class="cat-pick">
          <input type="radio" name="category" value="${c.id}" ${i === 0 ? "checked" : ""} required />
          <span>${c.emoji} ${escapeHtml(c.label)}${c.hint ? ` · ${escapeHtml(c.hint)}` : ""}</span>
        </label>`).join("");
      openDrawer(`
        <h3>Nouvelle activité</h3>
        <form id="add-form">
          <input type="text" name="title" placeholder="Ex. Temple Sensō-ji" maxlength="120" required />
          <p class="hint">Dans quelle catégorie ?</p>
          ${cats}
          <button class="btn primary" type="submit">Ajouter à la liste</button>
          <button class="btn ghost" type="button" id="cancel">Annuler</button>
        </form>`);
      const input = document.querySelector("#add-form [name=title]");
      input.focus();
      document.getElementById("add-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const title = input.value.trim();
        const category = (new FormData(e.target)).get("category");
        if (!title || !category) return;
        activities.push({ id: uid(), title, note: "", category, slot: null, locked: false });
        closeDrawer();
        touch();
      });
      document.getElementById("cancel").addEventListener("click", closeDrawer);
    }

    function openAssign(id) {
      const act = activities.find((a) => a.id === id);
      if (!act) return;
      const rows = DAYS.map((date) => {
        const label = dayFmt.format(new Date(date + "T12:00:00"));
        const am = inSlot(date, "am");
        const pm = inSlot(date, "pm");
        return `
          <div class="pick-day">
            <div class="name">${label}</div>
            <div class="pick-row">
              <button type="button" class="pick" data-slot="${date}-am" ${am.length >= MAX ? "disabled" : ""}>
                <b>Matin</b>${am.length}/${MAX}
              </button>
              <button type="button" class="pick" data-slot="${date}-pm" ${pm.length >= MAX ? "disabled" : ""}>
                <b>Après-midi</b>${pm.length}/${MAX}
              </button>
            </div>
          </div>`;
      }).join("");

      const note = act.note ? `<p class="hint">${escapeHtml(act.note)}</p>` : "";
      openDrawer(`
        <h3>${escapeHtml(act.title)}</h3>
        ${note}
        <p class="hint">Choisis un créneau (2 activités max par case).</p>
        ${rows}
        <button class="btn danger" type="button" id="delete">Supprimer de la liste</button>
        <button class="btn ghost" type="button" id="cancel">Annuler</button>`);

      document.querySelectorAll("[data-slot]").forEach((btn) => {
        btn.addEventListener("click", () => {
          act.slot = btn.dataset.slot;
          closeDrawer();
          touch();
        });
      });
      document.getElementById("delete").addEventListener("click", () => {
        activities = activities.filter((a) => a.id !== id);
        closeDrawer();
        touch();
      });
      document.getElementById("cancel").addEventListener("click", closeDrawer);
    }

    function openPlaced(id) {
      const act = activities.find((a) => a.id === id);
      if (!act) return;
      if (act.locked) {
        openDrawer(`
          <h3>${escapeHtml(act.title)}</h3>
          <p class="hint">Vol fixé dans le planning — on ne l’enlève pas.</p>
          <button class="btn ghost" type="button" id="cancel">Fermer</button>`);
        document.getElementById("cancel").addEventListener("click", closeDrawer);
        return;
      }
      openDrawer(`
        <h3>${escapeHtml(act.title)}</h3>
        <p class="hint">L’enlever la renvoie dans la liste d’activités.</p>
        <button class="btn danger" type="button" id="remove">Enlever du planning</button>
        <button class="btn ghost" type="button" id="cancel">Annuler</button>`);
      document.getElementById("remove").addEventListener("click", () => {
        act.slot = null;
        closeDrawer();
        touch();
      });
      document.getElementById("cancel").addEventListener("click", closeDrawer);
    }

    document.getElementById("add-btn").addEventListener("click", openAdd);
    document.getElementById("backdrop").addEventListener("click", closeDrawer);
    document.getElementById("planning").addEventListener("click", (e) => {
      const el = e.target.closest("[data-open]");
      if (el) openPlaced(el.dataset.open);
    });
    document.getElementById("activities").addEventListener("click", (e) => {
      const el = e.target.closest("[data-assign]");
      if (el) openAssign(el.dataset.assign);
    });

    async function boot() {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        try { activities = JSON.parse(cached).activities || []; } catch (_) {}
        if (activities.length) render();
      }
      try {
        await loadRemote();
        render();
        setSync("Enregistré · visible par tout le monde");
      } catch (e) {
        if (!activities.length) render();
        setSync("Hors ligne — les changements resteront sur cet appareil", true);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      enqueue(async () => {
        try {
          await loadRemote();
          render();
          setSync("À jour");
        } catch (_e) {}
      });
    });

    boot();
  </script>
</body>
</html>
