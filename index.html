<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#BC002D" />
  <title>Japon · novembre 2026</title>
  <style>
    :root {
      --bg: #8acaff;
      --ink: #1C1214;
      --muted: #7A5A5C;
      --card: #FFFFFF;
      --line: #F0D4D6;
      --accent: #BC002D;
      --accent-soft: #F8D5DA;
      --vol: #BC002D;
      --vol-soft: #F8D5DA;
      --danger: #9B2C2C;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; color-scheme: only light; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.4;
      padding: 0 0 48px;
      padding-bottom: max(48px, env(safe-area-inset-bottom));
    }
    .sun {
      position: absolute;
      top: 50%;
      right: 12px;
      height: 72%;
      aspect-ratio: 1;
      background: #BC002D;
      border-radius: 50%;
      opacity: 1;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 16px;
      position: relative;
      z-index: 1;
    }

    header {
      padding: 28px 0 8px;
      position: sticky;
      top: 0;
      width: 100%;
      background: #E0EEFC;
      overflow: hidden;
      z-index: 2;
    }
    .header-inner {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .flag {
      width: 42px;
      height: 28px;
      background: #fff;
      border: 1px solid #E8C9CC;
      border-radius: 3px;
      box-shadow: 0 1px 0 rgba(188, 0, 45, 0.08);
      position: relative;
      flex-shrink: 0;
    }
    .flag::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      background: #BC002D;
      border-radius: 50%;
      opacity: 1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    header h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.75rem;
      font-weight: 500;
      margin: 0;
      letter-spacing: 0.02em;
    }
    header p { margin: 0; color: var(--muted); font-size: 0.92rem; }
    #sync {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    #sync.err { color: var(--danger); }

    h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      font-weight: 500;
      margin: 28px 0 12px;
    }

    .day {
      background-color: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px 10px;
      margin-bottom: 10px;
    }
    .day-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .day-head strong { font-size: 0.95rem; }
    .badge {
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--vol-soft);
      color: var(--vol);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .slot {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px;
      padding: 7px 0;
      border-top: 1px solid var(--line);
    }
    .slot:first-of-type { border-top: 0; }
    .slot-label {
      font-size: 0.78rem;
      color: var(--muted);
      padding-top: 5px;
    }
    .chips { display: flex; flex-direction: column; gap: 6px; min-height: 28px; }
    .chip {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin: 0;
      padding: 7px 10px;
      border: 0;
      border-radius: 9px;
      background: #9477AC;
      color: #ffffff;
      font: inherit;
      font-size: 0.88rem;
      text-align: left;
      cursor: pointer;
    }
    .chip:active { transform: scale(0.99); }
    .empty {
      color: var(--muted);
      font-size: 0.82rem;
      padding: 6px 2px;
      font-style: italic;
    }

    .act-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .act-head h2 { margin: 28px 0 12px; }
    #add-btn {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .act-list { display: flex; flex-direction: column; gap: 8px; }
    .act {
      appearance: none;
      display: block;
      width: 100%;
      border: 0;
      background: #E0EEFC;
      color: var(--ink);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      font: inherit;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .act:active { background: #C9DDF8; }
    .act-note {
      display: block;
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 400;
    }
    .jst {
      font-size: 0.82rem;
      color: var(--accent);
      margin: -6px 0 14px;
    }
    .cat-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }
    .cat-block h3 {
      font-size: 0.88rem;
      font-weight: 650;
      margin: 0;
      color: var(--ink);
    }
    .cat-block h3 span {
      display: block;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--muted);
      margin-top: 2px;
    }
    .cat-pick {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #fff;
      font-size: 0.9rem;
    }
    .cat-pick:has(:checked) {
      border-color: var(--accent);
      background: #FFF5F6;
    }
    .cat-pick input { accent-color: var(--accent); margin-top: 3px; }

    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26, 23, 20, 0.35);
      z-index: 10;
    }
    .backdrop.on { display: block; }

    .drawer {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 11;
      background: var(--card);
      border-radius: 18px 18px 0 0;
      padding: 12px 16px calc(20px + env(safe-area-inset-bottom));
      max-height: 86vh;
      overflow: auto;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.12);
    }
    .drawer.on { display: block; }
    .handle {
      width: 40px;
      height: 4px;
      background: var(--line);
      border-radius: 999px;
      margin: 4px auto 0;
    }
    .drawer-top {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: flex-end;
      background: var(--card);
      z-index: 2;
      margin: 0 -16px 8px;
      padding: 4px 10px 8px;
    }
    .drawer-close {
      -webkit-appearance: none;
      appearance: none;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #F8DDE0;
      color: #BC002D;
      font-size: 1.5rem;
      line-height: 36px;
      padding: 0;
      cursor: pointer;
    }
    .drawer h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      margin: 0 0 12px;
      font-size: 1.15rem;
    }
    .drawer p.hint { color: var(--muted); font-size: 0.88rem; margin: 0 0 12px; }

    input[type="text"] {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      margin-bottom: 12px;
    }

    .btn {
      appearance: none;
      border: 0;
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      font: inherit;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.ghost { background: transparent; color: var(--muted); }
    .btn.danger { background: #F4D6D6; color: var(--danger); margin-top: 8px; }

    .pick-day { margin-bottom: 10px; }
    .pick-day .name { font-size: 0.85rem; margin-bottom: 6px; color: var(--muted); }
    .pick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pick {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 10px 8px;
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .pick:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .pick b { display: block; font-size: 0.88rem; margin-bottom: 2px; }

    .docs { margin: 0 0 14px; }
    .doc-list {
      list-style: none;
      margin: 0 0 10px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .doc-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F7F1F2;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .doc-list a {
      flex: 1;
      color: var(--accent);
      font-size: 0.9rem;
      word-break: break-word;
    }
    .doc-x {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 1.3rem;
      line-height: 1;
      padding: 0 4px;
      cursor: pointer;
    }
    .doc-add { display: block; text-align: center; cursor: pointer; }
    .doc-add input { display: none; }
    .doc-add[aria-busy="true"] { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <div class="sun" aria-hidden="true"></div>
    <div class="header-inner">
      <div class="brand">
        <span class="flag" role="img" aria-label="Drapeau du Japon"></span>
        <h1>Japon</h1>
      </div>
      <p>7 – 22 novembre 2026 · Paris ⇄ Japon</p>
      <span id="sync">Chargement…</span>
    </div>
  </header>
  <div class="wrap">
    <h2>Planning jour par jour</h2>
    <div id="planning"></div>

    <div class="act-head">
      <h2>Activités</h2>
      <button type="button" id="add-btn" aria-label="Ajouter une activité">+</button>
    </div>
    <p class="jst">Les sites de résa sont à l’heure japonaise (JST).</p>
    <div id="activities" class="act-list"></div>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true"></div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://lvisxqcwjblrmuxrnhfg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_lb5tHPwcfbs2_nRVR93Lrw_Raonh8rK";
    const TRIP_ID = "tokyo-2026";
    const DOCS_BUCKET = "docs";
    const MAX_DOC_BYTES = 10 * 1024 * 1024;
    const CACHE_KEY = "voyage-tokyo-2026";
    const MAX = 2;

    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    const DAYS = [];
    for (let d = 7; d <= 22; d++) DAYS.push(`2026-11-${String(d).padStart(2, "0")}`);

    const TRAVEL = new Set(["2026-11-07", "2026-11-08", "2026-11-22"]);

    const CATEGORIES = [
      { id: "urgence", emoji: "🚨", label: "Urgence maximale", hint: "À booker le jour J" },
      { id: "resa", emoji: "📅", label: "1 à 3 mois avant", hint: "À réserver assez tôt" },
      { id: "gastro", emoji: "🍜", label: "Gastronomie & culture", hint: "Sur le long terme" },
      { id: "events", emoji: "✨", label: "Événements de novembre", hint: "" },
      { id: "gratuit", emoji: "🏃", label: "Spots gratuits", hint: "Lever aux aurores" },
      { id: "shopping", emoji: "🛍️", label: "Shopping", hint: "" },
    ];

    const dayFmt = new Intl.DateTimeFormat("fr-FR", {
      weekday: "short",
      day: "numeric",
      month: "short",
    });

    let activities = [];
    let rev = 0;
    let chain = Promise.resolve();

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function enqueue(fn) {
      const run = chain.then(fn, fn);
      chain = run.catch(() => {});
      return run;
    }

    function normalize(list) {
      if (!Array.isArray(list)) return [];
      return list.map((a) => ({
        ...a,
        docs: Array.isArray(a.docs) ? a.docs : [],
      }));
    }

    function safeFileName(name) {
      const cleaned = String(name || "doc").replace(/[^\w.\-]+/g, "_").replace(/^\.+/, "");
      return cleaned.slice(0, 80) || "doc";
    }

    function isAllowedDoc(file) {
      if (file.size > MAX_DOC_BYTES) return "Fichier trop lourd (10 Mo max).";
      const okType = /^(application\/pdf|image\/(jpeg|png|webp|heic|heif))$/i.test(file.type);
      const okExt = /\.(pdf|jpe?g|png|webp|heic|heif)$/i.test(file.name);
      if (!okType && !okExt) return "PDF ou image uniquement.";
      return "";
    }

    async function withRetry(fn, tries) {
      let last;
      for (let i = 0; i < (tries || 3); i++) {
        try {
          return await fn();
        } catch (err) {
          last = err;
          await new Promise((r) => setTimeout(r, 350 * (i + 1)));
        }
      }
      throw last;
    }

    function inSlot(date, part) {
      const slot = `${date}-${part}`;
      return activities.filter((a) => a.slot === slot);
    }

    function setSync(text, err) {
      const el = document.getElementById("sync");
      el.textContent = text;
      el.classList.toggle("err", !!err);
    }

    function persistLocal() {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ activities }));
    }

    async function loadRemote() {
      const started = rev;
      const data = await withRetry(async () => {
        const { data, error } = await sb
          .from("trip_state")
          .select("activities")
          .eq("id", TRIP_ID)
          .single();
        if (error) throw error;
        if (!Array.isArray(data.activities)) throw new Error("Réponse invalide");
        return data;
      });
      if (started !== rev) return;
      activities = normalize(data.activities);
      persistLocal();
    }

    function touch() {
      rev += 1;
      persistLocal();
      render();
      saveRemote();
    }

    function saveRemote() {
      const started = rev;
      setSync("Enregistrement…");
      return enqueue(async () => {
        if (started !== rev) return;
        const snapshot = activities;
        try {
          const data = await withRetry(async () => {
            const { data, error } = await sb
              .from("trip_state")
              .update({ activities: snapshot, updated_at: new Date().toISOString() })
              .eq("id", TRIP_ID)
              .select("activities")
              .single();
            if (error) throw error;
            return data;
          });
          if (started !== rev) return;
          if (Array.isArray(data.activities)) {
            activities = normalize(data.activities);
            persistLocal();
          }
          setSync("Enregistré · visible par tout le monde");
        } catch (_e) {
          setSync("Pas de réseau — nouvel essai au prochain geste", true);
        }
      });
    }

    function render() {
      const planning = document.getElementById("planning");
      planning.innerHTML = DAYS.map((date) => {
        const label = dayFmt.format(new Date(date + "T12:00:00"));
        const badge = TRAVEL.has(date) ? '<span class="badge">Vol</span>' : "";
        return `
          <article class="day">
            <div class="day-head">
              <strong>${label}</strong>
              ${badge}
            </div>
            ${renderSlot(date, "am", "Matin")}
            ${renderSlot(date, "pm", "Après-midi")}
          </article>`;
      }).join("");

      const list = activities.filter((a) => !a.slot);
      const box = document.getElementById("activities");
      if (!list.length) {
        box.innerHTML = '<p class="empty">Aucune proposition. Appuie sur + pour en ajouter une.</p>';
        return;
      }
      box.innerHTML = CATEGORIES.map((cat) => {
        const items = list.filter((a) => a.category === cat.id);
        if (!items.length) return "";
        const hint = cat.hint ? `<span>${escapeHtml(cat.hint)}</span>` : "";
        const cards = items.map((a) => {
          const note = a.note ? `<span class="act-note">${escapeHtml(a.note)}</span>` : "";
          return `<button type="button" class="act" data-assign="${a.id}"><strong>${escapeHtml(a.title)}</strong>${note}</button>`;
        }).join("");
        return `<section class="cat-block"><h3>${cat.emoji} ${escapeHtml(cat.label)}${hint}</h3>${cards}</section>`;
      }).join("");
    }

    function renderSlot(date, part, label) {
      const items = inSlot(date, part);
      let inner;
      if (!items.length) {
        inner = '<div class="empty">Libre</div>';
      } else {
        inner = items.map((a) =>
          `<span class="chip" role="button" tabindex="0" data-open="${a.id}">${escapeHtml(a.title)}</span>`
        ).join("");
      }
      return `
        <div class="slot">
          <div class="slot-label">${label}${items.length ? ` · ${items.length}/${MAX}` : ""}</div>
          <div class="chips">${inner}</div>
        </div>`;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function docsHtml(act) {
      const docs = Array.isArray(act.docs) ? act.docs : [];
      const items = docs.length
        ? `<ul class="doc-list">${docs.map((d, i) => `
            <li>
              <a href="${escapeHtml(d.url)}" target="_blank" rel="noopener">${escapeHtml(d.name)}</a>
              <button type="button" class="doc-x" data-doc-i="${i}" aria-label="Retirer le document">×</button>
            </li>`).join("")}</ul>`
        : "";
      return `
        <div class="docs">
          ${items}
          <label class="btn primary doc-add">
            Ajouter un doc
            <input type="file" accept="application/pdf,image/jpeg,image/png,image/webp,image/heic,image/heif,.pdf,.jpg,.jpeg,.png,.webp,.heic" />
          </label>
        </div>`;
    }

    function wireDocs(act, reopen) {
      const add = document.querySelector(".doc-add");
      const input = add && add.querySelector("input");
      if (input) {
        input.addEventListener("change", async () => {
          const file = input.files && input.files[0];
          input.value = "";
          if (!file) return;
          const problem = isAllowedDoc(file);
          if (problem) {
            setSync(problem, true);
            return;
          }
          add.setAttribute("aria-busy", "true");
          setSync("Envoi du document…");
          const path = `${act.id}/${uid()}-${safeFileName(file.name)}`;
          const { error } = await sb.storage.from(DOCS_BUCKET).upload(path, file, {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type || undefined,
          });
          add.removeAttribute("aria-busy");
          if (error) {
            setSync("Échec de l’envoi du document", true);
            return;
          }
          const { data } = sb.storage.from(DOCS_BUCKET).getPublicUrl(path);
          if (!Array.isArray(act.docs)) act.docs = [];
          act.docs.push({ name: file.name, path, url: data.publicUrl });
          touch();
          reopen();
        });
      }
      document.querySelectorAll("[data-doc-i]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const i = Number(btn.dataset.docI);
          const doc = act.docs && act.docs[i];
          if (!doc) return;
          act.docs = act.docs.filter((_, idx) => idx !== i);
          touch();
          reopen();
          if (doc.path) {
            await sb.storage.from(DOCS_BUCKET).remove([doc.path]).catch(() => {});
          }
        });
      });
    }

    async function removeStoredDocs(act) {
      const paths = (act && act.docs ? act.docs : []).map((d) => d.path).filter(Boolean);
      if (!paths.length) return;
      await sb.storage.from(DOCS_BUCKET).remove(paths).catch(() => {});
    }

    function openDrawer(html) {
      const drawer = document.getElementById("drawer");
      drawer.innerHTML = '<div class="handle"></div><div class="drawer-top"><button type="button" class="drawer-close" id="drawer-close" aria-label="Fermer">×</button></div>' + html;
      drawer.classList.add("on");
      document.getElementById("backdrop").classList.add("on");
      document.getElementById("drawer-close").addEventListener("click", closeDrawer);
    }

    function closeDrawer() {
      document.getElementById("drawer").classList.remove("on");
      document.getElementById("backdrop").classList.remove("on");
    }

    function openAdd() {
      const cats = CATEGORIES.map((c, i) => `
        <label class="cat-pick">
          <input type="radio" name="category" value="${c.id}" ${i === 0 ? "checked" : ""} required />
          <span>${c.emoji} ${escapeHtml(c.label)}${c.hint ? ` · ${escapeHtml(c.hint)}` : ""}</span>
        </label>`).join("");
      openDrawer(`
        <h3>Nouvelle activité</h3>
        <form id="add-form">
          <input type="text" name="title" placeholder="Ex. Temple Sensō-ji" maxlength="120" required />
          <p class="hint">Dans quelle catégorie ?</p>
          ${cats}
          <button class="btn primary" type="submit">Ajouter à la liste</button>
          <button class="btn ghost" type="button" id="cancel">Annuler</button>
        </form>`);
      const input = document.querySelector("#add-form [name=title]");
      input.focus();
      document.getElementById("add-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const title = input.value.trim();
        const category = (new FormData(e.target)).get("category");
        if (!title || !category) return;
        activities.push({ id: uid(), title, note: "", category, slot: null, locked: false, docs: [] });
        closeDrawer();
        touch();
      });
      document.getElementById("cancel").addEventListener("click", closeDrawer);
    }

    function openAssign(id) {
      const act = activities.find((a) => a.id === id);
      if (!act) return;
      const rows = DAYS.filter((date) => !TRAVEL.has(date)).map((date) => {
        const label = dayFmt.format(new Date(date + "T12:00:00"));
        const am = inSlot(date, "am");
        const pm = inSlot(date, "pm");
        return `
          <div class="pick-day">
            <div class="name">${label}</div>
            <div class="pick-row">
              <button type="button" class="pick" data-slot="${date}-am" ${am.length >= MAX ? "disabled" : ""}>
                <b>Matin</b>${am.length}/${MAX}
              </button>
              <button type="button" class="pick" data-slot="${date}-pm" ${pm.length >= MAX ? "disabled" : ""}>
                <b>Après-midi</b>${pm.length}/${MAX}
              </button>
            </div>
          </div>`;
      }).join("");

      const note = act.note ? `<p class="hint">${escapeHtml(act.note)}</p>` : "";
      openDrawer(`
        <h3>${escapeHtml(act.title)}</h3>
        ${note}
        ${docsHtml(act)}
        <p class="hint">Choisis un créneau (2 activités max par case).</p>
        ${rows}
        <button class="btn danger" type="button" id="delete">Supprimer de la liste</button>
        <button class="btn ghost" type="button" id="cancel">Annuler</button>`);

      wireDocs(act, () => openAssign(id));
      document.querySelectorAll("[data-slot]").forEach((btn) => {
        btn.addEventListener("click", () => {
          act.slot = btn.dataset.slot;
          closeDrawer();
          touch();
        });
      });
      document.getElementById("delete").addEventListener("click", () => {
        const gone = activities.find((a) => a.id === id);
        activities = activities.filter((a) => a.id !== id);
        closeDrawer();
        touch();
        removeStoredDocs(gone);
      });
      document.getElementById("cancel").addEventListener("click", closeDrawer);
    }

    function openPlaced(id) {
      const act = activities.find((a) => a.id === id);
      if (!act) return;
      if (act.locked) {
        openDrawer(`
          <h3>${escapeHtml(act.title)}</h3>
          <p class="hint">Vol fixé dans le planning — on ne l’enlève pas.</p>
          ${docsHtml(act)}
          <button class="btn ghost" type="button" id="cancel">Fermer</button>`);
        wireDocs(act, () => openPlaced(id));
        document.getElementById("cancel").addEventListener("click", closeDrawer);
        return;
      }
      openDrawer(`
        <h3>${escapeHtml(act.title)}</h3>
        <p class="hint">L’enlever la renvoie dans la liste d’activités.</p>
        ${docsHtml(act)}
        <button class="btn danger" type="button" id="remove">Enlever du planning</button>
        <button class="btn ghost" type="button" id="cancel">Annuler</button>`);
      wireDocs(act, () => openPlaced(id));
      document.getElementById("remove").addEventListener("click", () => {
        act.slot = null;
        closeDrawer();
        touch();
      });
      document.getElementById("cancel").addEventListener("click", closeDrawer);
    }

    document.getElementById("add-btn").addEventListener("click", openAdd);
    document.getElementById("backdrop").addEventListener("click", closeDrawer);
    document.getElementById("planning").addEventListener("click", (e) => {
      const el = e.target.closest("[data-open]");
      if (el) openPlaced(el.dataset.open);
    });
    document.getElementById("activities").addEventListener("click", (e) => {
      const el = e.target.closest("[data-assign]");
      if (el) openAssign(el.dataset.assign);
    });

    async function boot() {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        try { activities = normalize(JSON.parse(cached).activities || []); } catch (_) {}
        if (activities.length) render();
      }
      try {
        await loadRemote();
        render();
        setSync("Enregistré · visible par tout le monde");
      } catch (e) {
        if (!activities.length) render();
        setSync("Hors ligne — les changements resteront sur cet appareil", true);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      enqueue(async () => {
        try {
          await loadRemote();
          render();
          setSync("À jour");
        } catch (_e) {}
      });
    });

    boot();
  </script>
</body>
</html>
